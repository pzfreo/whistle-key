name: Build and test CAD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Regenerate STEP and STL files
        run: |
          python scripts/build_ci.py
          python scripts/build_ci.py --model three_key --output build/three-key
          python scripts/build_ci.py --model three_key_3mm_spring --output build/three-key-3mm-spring
          python scripts/build_ci.py --model three_key_3mm_short_spring --output build/three-key-3mm-short-spring
      - name: Package oriented print projects
        run: |
          python scripts/package_3mf.py --source build --output build/whistle-key-P1S.3mf
          python scripts/package_3mf.py --source build --dry-run --output build/whistle-key-P1S-dry-fit-PETG.3mf
          python scripts/package_3mf.py --three-key --source build/three-key --output build/three-key/whistle-three-key-P1S.3mf
          python scripts/package_3mf.py --three-key --source build/three-key-3mm-spring --output build/three-key-3mm-spring/whistle-three-key-3mm-spring-P1S.3mf
          python scripts/package_3mf.py --three-key --source build/three-key-3mm-short-spring --output build/three-key-3mm-short-spring/whistle-three-key-3mm-short-spring-P1S.3mf
      - name: Test geometry and exports
        run: python -m pytest -q --junitxml=build/test-results.xml
      - name: Upload verified CAD files
        uses: actions/upload-artifact@v7
        with:
          name: whistle-cad
          path: build/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-cad-test-results
          path: build/test-results.xml
          if-no-files-found: ignore
          retention-days: 7
