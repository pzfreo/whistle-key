name: Build and test CAD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Regenerate STEP and STL files
        run: python scripts/build_ci.py
      - name: Test geometry and exports
        run: python -m pytest -q --junitxml=build/test-results.xml
      - name: Upload verified CAD files
        uses: actions/upload-artifact@v7
        with:
          name: single-key-cad
          path: build/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-cad-test-results
          path: build/test-results.xml
          if-no-files-found: ignore
          retention-days: 7
